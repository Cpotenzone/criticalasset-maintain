name: Build, Push, and Deploy (AWS)
concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Maintain left Cloud Run on 2026-08-01. api + web are Docker containers under
# systemd on EC2 i-0ed39f799ead6a666 (us-east-1c), ports 8084 / 8085, behind
# ALB dr-castle-alb. Database is the `maintain` database on RDS
# ca-osint-db.cq3koyyq42za.us-east-1.rds.amazonaws.com (sslmode=require).
#
# Auth is OIDC. This repo is PUBLIC, so the role's trust policy is scoped to
# this repository and mints 1-hour sessions — there is no long-lived key here.
# Delete the old GCP_SA_KEY-shaped secrets from the repo settings now that this
# is cut over.

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 886781462397.dkr.ecr.us-east-1.amazonaws.com

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.DOCKER_TAG }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886781462397:role/maintain-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-maintain-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: vars
        run: echo "DOCKER_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # The serve box is amd64. arm64 (for self-hosters on Pi/Apple Silicon) is
      # QEMU-emulated on GitHub's amd64 runners and was taking 40+ minutes for
      # the frontend alone; self-hosters wanting arm64 already have `build:` in
      # docker-compose.yml.
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/maintain-api:${{ steps.vars.outputs.DOCKER_TAG }}
            ${{ env.ECR_REGISTRY }}/maintain-api:prod

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/maintain-web:${{ steps.vars.outputs.DOCKER_TAG }}
            ${{ env.ECR_REGISTRY }}/maintain-web:prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886781462397:role/maintain-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-maintain-deploy-${{ github.run_id }}

      - name: Deploy to the serve box
        run: ./scripts/aws-deploy.sh
